<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Отчёты Даниловых</title><style>
[hidden]{display:none!important}
:root{color-scheme:light;
--bg:#869c6f;--cream:#fff7e5;--ink:#062618;--ink-muted:#123a2c;--ink-line:#647a50;--ink-warn:#5a1400;--paper:#fff7e5;
--card:#062618;--card-text:#fff7e5;--card-muted:#a9bba9;--card-line:#1e4a37;--card-warn:#f59168;
--teal:#319a7c;--teal-soft:#5cc0a2;--blue:#4886ff;--olive:#499614;--orange:#cd3a0b;
--text:var(--ink);--muted:var(--ink-muted);--line:var(--ink-line);--warn:var(--ink-warn);--due:var(--ink-warn);--mark:var(--teal);
--display:"Sitka Banner","Sitka Heading","Source Serif 4",Georgia,serif;
--body:"ITC Avant Garde Gothic","Jost",-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--body)}
main{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 116px;
display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-start;gap:12px}
header div{display:flex;flex-direction:column;gap:2px;min-width:0;margin-right:auto}
h1{font:600 clamp(25px,6.6vw,34px)/1.08 var(--display);margin:0;color:var(--ink);text-wrap:balance}
/* The brand book shows its palette as a stack of bands; the same four accents mark the page. */
.band{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--blue) 0 25%,var(--cream) 25% 50%,var(--teal) 50% 75%,var(--orange) 75% 100%)}
h2{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
h3{font:600 19px/1.25 var(--display);margin:6px 0 0}
h3.sub{font:600 17px/1.25 var(--display);margin:8px 0 0;padding-top:10px;border-top:1px solid var(--line)}
h2+h3.sub{border-top:0;padding-top:0;margin-top:2px}
p{margin:0}
.muted{color:var(--muted);font-size:13px}
.warn{color:var(--warn)}
.lead{font-size:17px;font-weight:500}
form{display:flex;flex-direction:column;gap:10px;max-width:360px}
input{font:inherit;padding:11px 12px;border-radius:8px;border:1px solid var(--ink-line);background:var(--paper);color:var(--ink)}
button{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid var(--ink);background:none;color:var(--ink);cursor:pointer}
button.primary{background:var(--ink);color:var(--card-text);font-weight:600}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.err{color:var(--ink-warn);min-height:1.5em}
.pane{display:flex;flex-direction:column;gap:12px}
/* Deep-green cards on the cream page: inside a card the text tokens switch to the card set. */
.blk,.card{--text:var(--card-text);--muted:var(--card-muted);--line:var(--card-line);--warn:var(--card-warn);
--due:var(--card-warn);--mark:var(--teal-soft);background:var(--card);color:var(--text);border-radius:14px;
padding:14px 16px;display:flex;flex-direction:column;gap:7px;min-width:0}
.blk.key{box-shadow:inset 0 0 0 2px var(--teal)}
.blk .pane{gap:8px}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.links a{font-size:13px;font-weight:500;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 11px;
background:var(--card-line)}
ul,ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
li{overflow-wrap:anywhere}
li::marker{color:var(--mark)}
a{color:var(--text);text-decoration-color:var(--mark);text-decoration-thickness:2px;text-underline-offset:3px}
b{font-weight:600}
.num{font:600 27px/1.15 var(--display);font-variant-numeric:tabular-nums}
.pair{display:flex;gap:18px;flex-wrap:wrap}
.pair div{display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px}
.bar h3{margin:0 auto 0 0;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wd{font-size:12px;color:var(--ink-muted);text-align:center;letter-spacing:.06em}
.day{min-height:52px;border:1px solid var(--ink-line);border-radius:8px;background:var(--paper);color:var(--ink);
padding:5px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;font:inherit;text-align:left;cursor:pointer}
.day.out{opacity:.4}.day.today{border-color:var(--ink);border-width:2px}
.day.busy{background:var(--card);color:var(--card-text);border-color:var(--card)}
.day.sel{outline:3px solid var(--orange);outline-offset:1px}
.day .n{font-variant-numeric:tabular-nums;font-size:14px}
.day .c{font-size:12px;font-weight:600;color:var(--card);background:var(--teal-soft);border-radius:999px;padding:0 7px}
.head{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.head .t{font-weight:600;font-variant-numeric:tabular-nums}
.badge{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted)}
dl{margin:0;display:grid;grid-template-columns:minmax(96px,34%) minmax(0,1fr);gap:3px 10px;font-size:14px}
dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}dd.due{color:var(--due);font-weight:600}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);
padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;justify-content:center}
nav button{flex:1 1 0;max-width:170px;border:0;background:none;color:var(--card-muted);padding:10px 4px;
font-size:14px;font-weight:600;border-radius:999px}
nav button[aria-selected="true"]{color:var(--card);background:var(--bg)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

const $=id=>document.getElementById(id);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(blob,pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(blob.salt),iterations:ITER,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(blob.iv)},key,b64(blob.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
const rub=v=>(typeof v==="number"&&isFinite(v))?new Intl.NumberFormat("ru-RU").format(Math.round(v))+" ₽":"—";
const txt=v=>(v===null||v===undefined||v==="")?"—":String(v);
const arr=v=>Array.isArray(v)?v:[];
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const dm=k=>{const p=String(k).split("-");return `${p[2]}.${p[1]}`;};
function omskNow(){const p=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Omsk",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());const n=k=>+p.find(x=>x.type===k).value;return new Date(n("year"),n("month")-1,n("day"));}
function covered(k){return !DATA.coverage||(k>=DATA.coverage.start&&k<DATA.coverage.end);}
function isSnapshotStale(data,day=omskNow()){return data.source_date?data.source_date!==iso(day):Boolean(data.stale);}
function refreshSnapshotDate(){if(!DATA)return;DATA.stale=isSnapshotStale(DATA);paneToday();paneBookings();}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function link(text,url){
  if(typeof url!=="string"||!url.startsWith("https://"))return null;
  const a=el("a",null,text);a.href=url;a.target="_blank";a.rel="noopener";return a;
}
function row(){const li=el("li");for(const part of arguments){if(part==null)continue;li.append(typeof part==="string"?document.createTextNode(part):part);}return li;}
function list(rows,empty,ordered){
  if(!rows.length)return el("p","muted",empty);
  const l=el(ordered?"ol":"ul");l.append(...rows);return l;
}
function blk(title,cls){const s=el("section","blk"+(cls?" "+cls:""));s.append(el("h2",null,title));return s;}
// A block that did not arrive or failed says so; numbers are never made up.
function problem(b){
  if(b===null||b===undefined)return "нет данных";
  if(typeof b!=="object")return "нет данных · ошибка формата";
  if(b.status==="not_connected")return "не подключено";
  if(b.status!=="ok")return "нет данных"+(b.error?" — "+b.error:"");
  return null;
}
// Shortcuts into the service behind a block (2GIS cabinet, mailbox, Bitrix…), shown even when the block has no data.
function chips(items){
  const links=arr(items).map(i=>link(txt(i&&i.label),i&&i.url)).filter(Boolean);
  if(!links.length)return null;
  const box=el("div","links");box.append(...links);return box;
}
function section(title,b,build,cls,links){
  const s=blk(title,cls),bad=problem(b),go=chips(links);
  if(bad)s.append(el("p","warn",bad));
  else{try{s.append(...[].concat(build(b)).filter(Boolean));}catch(e){s.append(el("p","warn","нет данных · ошибка формата"));}}
  if(go)s.append(go);
  return s;
}
function kindRows(b,empty){
  return list(arr(b.items).map(i=>{const k=el("b",null,txt(i&&i.kind));return row(k,": "+txt(i&&i.text)+" ",link("открыть",i&&i.url));}),empty);
}

let DATA=null,byDate={},view,selected;

function paneToday(){
  const p=$("pane-today"),b=DATA.brief||{},m=DATA.money,L=DATA.links||{};p.replaceChildren();
  if(DATA.stale)p.append(el("p","warn",DATA.brief_date?`Сводка от ${DATA.brief_date}: сегодня она ещё не собиралась.`:"Сводка сегодня ещё не собиралась."));
  if(m&&arr(m.headline).length){const s=blk("Главное","key");for(const h of m.headline)s.append(el("p","lead",txt(h)));p.append(s);}
  // Guests, load, deals and the visit check all live in Bitrix: one card, one pair of shortcuts.
  const main=blk("Записи и сделки",m?null:"key");
  const part=(label,block,build)=>{
    main.append(el("h3","sub",label));const bad=problem(block);
    if(bad){main.append(el("p","warn",bad));return;}
    try{main.append(...[].concat(build(block)).filter(Boolean));}catch(e){main.append(el("p","warn","нет данных · ошибка формата"));}
  };
  part(DATA.stale&&DATA.source_date?"Гости на "+DATA.source_date:"Гости сегодня",b.today_guests,x=>list(arr(x.items).map(g=>{
    let t=`${txt(g.time)} ${txt(g.name)}`;if(g.program)t+=` — ${g.program}`;
    if(g.price_status==="pending")t+=" · стоимость не согласована";
    if(typeof g.due==="number"&&g.due>0)t+=` · к доплате ${rub(g.due)}`;else if(g.due==null)t+=" · доплата не подтверждена";
    if(g.barter===true)t+=" · бартер";if(arr(g.warnings).length)t+=" · "+g.warnings.join("; ");return row(t);}),"Гостей нет"));
  part("Загрузка",b.load,x=>{
    const o=x.occupancy,bad=problem(o);if(bad)return el("p","warn",bad);
    const dates=arr(o.week_dates).join(", ");
    return [el("p",null,`Неделя: занято ${txt(o.week_busy)} из ${txt(o.week_days)} дней`+(dates?`: ${dates}`:"")),
            el("p",null,`${o.month?txt(o.month):"Месяц"}: занято ${txt(o.month_busy)} из ${txt(o.month_days)}`)];});
  part("Заявки и сделки за вчера",b.deals,x=>list(arr(x.funnels).filter(f=>f&&(f.new||f.in_progress||f.won||f.lost)).map(f=>
    row(`${txt(f.name)}: новые ${txt(f.new)}, в работе ${txt(f.in_progress)}, успешно ${txt(f.won)}, провал ${txt(f.lost)}`)),"Сделок нет"));
  part("Проверка записей",b.link_check,x=>kindRows(x,"Во всех записях есть дата, время и длительность"));
  const mainGo=chips(L.bookings_deals);if(mainGo)main.append(mainGo);
  p.append(main);
  if(b.technical&&arr(b.technical.items).length)p.append(section("Технические блокировки",b.technical,x=>kindRows(x,"")));
  if(b.instagram)p.append(section("Instagram: обращения",b.instagram,x=>kindRows(x,"Всем ответили, на каждое обращение есть сделка"),null,L.instagram));
  p.append(section("Задачи команды",b.tasks,x=>list(arr(x.by_person).map(t=>{
    const parts=[];if(arr(t.overdue).length)parts.push("просрочено: "+t.overdue.join(", "));
    if(arr(t.due_today).length)parts.push("сегодня: "+t.due_today.join(", "));
    return parts.length?row(el("b",null,txt(t.name))," — "+parts.join("; ")):null;}).filter(Boolean),"Просроченных и срочных задач нет"),null,L.tasks));
  p.append(section("Контент",b.content,x=>{
    const stats=[el("p","muted","Статистика"),list(arr(x.stats).map(i=>row(`${txt(i.account)} — ${txt(i.metric)}: `,el("b",null,txt(i.value)))),"Нет цифр")];
    if(x.note)return [el("p","warn","Публикации: "+x.note),...stats];
    return [el("p","muted","Вышло вчера"),list(arr(x.published).map(i=>row(`${txt(i.account)}: ${txt(i.title)}`)),"Ничего не выходило"),
      el("p","muted","Запланировано"),list(arr(x.scheduled).map(i=>row(`${txt(i.account)}: ${txt(i.title)} (${txt(i.at)})`)),"Ничего не запланировано"),...stats];},null,L.content));
  p.append(section("Отзывы",b.reviews,x=>list(arr(x.items).map(i=>row(`${txt(i.platform)}: новых ${txt(i.new)}, рейтинг ${txt(i.rating)}`)),"Новых отзывов нет"),null,L.reviews));
  p.append(section("Почта",b.mail,x=>list(arr(x.items).map(i=>{
    const li=row(`${txt(i.box)}: `+(typeof i.unread==="number"?`непрочитанных ${i.unread}`:txt(i.unread)));
    if(arr(i.latest).length){const u=el("ul");for(const mm of i.latest)u.append(row(`${txt(mm.from)} — ${txt(mm.subject)}`));li.append(u);}
    return li;}),"Ящики не подключены"),null,L.mail));
  p.append(section("Что сделать сегодня",b.todo,x=>list(arr(x.items).slice().sort((a,c)=>(+a.priority||99)-(+c.priority||99)).map(i=>row(txt(i.text))),"Срочного нет",true)));
}

function upcoming(){
  const s=blk("Ближайшие 14 дней"),today=omskNow(),rows=[],free=[];let busy=0,loaded=0;
  if(DATA.stale){s.append(el("p","warn","Снимок устарел; актуальная доступность неизвестна."));return s;}
  for(let i=0;i<14;i++){
    const d=new Date(today.getFullYear(),today.getMonth(),today.getDate()+i),k=iso(d),recs=byDate[k]||[];
    if(!covered(k))continue;loaded++;
    if(!recs.length){free.push(dm(k));continue;}
    busy++;
    for(const r of recs){
      let t=`${WD[(d.getDay()+6)%7]} ${dm(k)} · ${txt(r.time)} ${txt(r.guest)}`;
      if(r.stage&&r.stage!=="—")t+=` — ${r.stage}`;
      if(typeof r.due==="number"&&r.due>0)t+=` · к доплате ${rub(r.due)}`;if(r.barter===true)t+=" · бартер";
      rows.push(row(t));
    }
  }
  s.append(list(rows,loaded?"Записей в полученном снимке нет":"Этот период не загружен"),el("p","muted",`Занято ${busy} из ${loaded} проверенных дней`+(free.length?`. Нет записей в снимке: ${free.join(", ")}`:"")));
  s.append(el("p","muted","Доступность показана по снимку CRM; технические блокировки учитываются отдельно от гостей."));
  return s;
}
function drawMonth(){
  $("month").textContent=`${MONTHS[view.getMonth()]} ${view.getFullYear()}`;
  const g=$("grid");g.replaceChildren(...WD.map(w=>el("div","wd",w)));
  const shift=(view.getDay()+6)%7,d=new Date(view);d.setDate(1-shift);const today=iso(omskNow());
  for(let i=0;i<42;i++){
    const k=iso(d),n=(byDate[k]||[]).length,b=el("button","day");b.type="button";
    if(d.getMonth()!==view.getMonth())b.classList.add("out");
    if(k===today)b.classList.add("today");if(n)b.classList.add("busy");if(k===selected)b.classList.add("sel");
    b.append(el("span","n",String(d.getDate())));if(n)b.append(el("span","c",String(n)));
    b.setAttribute("aria-label",`${d.getDate()} ${MONTHS_GEN[d.getMonth()]}: `+(covered(k)?`записей ${n}`:"данные не загружены"));
    b.onclick=()=>{selected=k;drawMonth();$("daylist").scrollIntoView({behavior:"smooth",block:"start"});};
    g.append(b);d.setDate(d.getDate()+1);
  }
  const box=$("daylist"),rows=byDate[selected]||[],p=selected.split("-");
  box.replaceChildren(el("h3",null,`${+p[2]} ${MONTHS_GEN[+p[1]-1]}`+(covered(selected)?` — записей: ${rows.length}`:" — нет данных")));
  if(!covered(selected)){box.append(el("p","warn","Этот день вне загруженного периода; доступность неизвестна."));return;}
  if(!rows.length)box.append(el("p","muted","В этом снимке записей на день нет."));
  const pay=(v,dd,mm)=>v==null?"—":[rub(v),dd,mm].filter(x=>x&&x!=="—").join(" · ");
  for(const r of rows){
    const c=el("div","card"),h=el("div","head");
    h.append(el("span","t",txt(r.time)),el("span",null,txt(r.guest)));
    if(r.guests&&r.guests!=="—")h.append(el("span","badge",`Гостей: ${r.guests}`));
    if(r.url){const v=r.visits_before||0;h.append(el("span","badge",v?`постоянный гость · ${v+1}-й визит`:"первый визит"));}
    c.append(h);
    if(r.technical){c.append(el("p","muted","Техническая блокировка. Не гостевой визит и не выручка."));box.append(c);continue;}
    const dl=el("dl");
    for(const [k,v] of [["Стадия",txt(r.stage)],["Программа",txt(r.program)],["Пар-мастера",txt(r.master)],
      ["Сумма",r.price_status==="pending"?"не согласована":r.amount==null?"не подтверждена":rub(r.amount)],["Предоплата",pay(r.prepaid,r.prepay_date,r.prepay_method)],
      ["Доплата",pay(r.surcharge,r.surcharge_date,r.surcharge_method)],["К доплате",r.due==null?"—":rub(r.due)],
      ["Комментарий",txt(r.comment)],["Источник",txt(r.source)],["Ответственный",txt(r.responsible)]]){
      dl.append(el("dt",null,k),el("dd",k==="К доплате"&&r.due?"due":null,v));
    }
    c.append(dl);const a=link("Открыть в Битрикс",r.url);if(a)c.append(a);
    for(const warning of arr(r.warnings))c.append(el("p","warn",txt(warning)));
    box.append(c);
  }
}
function paneBookings(){
  const p=$("pane-bookings"),cal=$("cal");
  p.replaceChildren();
  if(DATA.bookings_error){p.append(el("p","warn","Записи прочитать не удалось; доступность неизвестна."));return;}
  if(DATA.coverage)p.append(el("p","muted",`Охват: ${DATA.coverage.start} — ${DATA.coverage.end} (конец не включён).`));
  p.append(upcoming(),cal);cal.hidden=false;drawMonth();
}

function paneMoney(){
  const p=$("pane-money"),m=DATA.money;p.replaceChildren();if(!m)return;const ML=m.links||{};
  if(m.finance_snapshot){const f=m.finance_snapshot,s=blk("Финансы Каменки","key");
    s.append(el("p",null,txt(f.source)),el("p","muted","Снимок сформирован: "+txt(f.checked_at)),
      el("p","warn","Время экспорта не подтверждает актуальность учетных данных. Баланс и прибыль отдельно не подтверждены."));
    if(f.status!=="ok")s.append(el("p","warn",f.status==="partial"?"Частичный снимок":"Нет данных"));
    if(f.error)s.append(el("p","warn",txt(f.error)));
    for(const i of arr(f.items))s.append(el("p",null,`${txt(i.label)}: ${txt(i.value)} ${i.unit||""}`));p.append(s);}
  const stale=x=>x&&x.as_of?el("p","muted",`данные на ${x.as_of}`):null;
  p.append(section("Выручка",m.revenue,r=>{
    const pair=el("div","pair");
    for(const [label,v] of [[`${txt(r.month)}, факт`,r.month_fact],["с бронями",r.month_total]]){
      const d=el("div");d.append(el("span","num",rub(v)),el("span","muted",label));pair.append(d);}
    return [pair,el("p",null,`${txt(r.prev_month)}: ${rub(r.prev_total)} · за 7 дней: ${rub(r.week)}`),stale(r)];},"key",ML.revenue));
  p.append(section("Оплаты за вчера",m.payments,x=>arr(x.items).length?[el("p",null,`Всего: ${rub(x.total)}`),
    list(arr(x.items).map(i=>row(`${txt(i.method)}: ${rub(i.amount)} (${txt(i.count)})`)),"")]:el("p","muted","Оплат не было"),null,ML.payments));
  p.append(section("Учёт (Каменка)",m.kamenka,x=>[
    el("p",null,`Заказы из Битрикс: создано ${txt(x.created)}, обновлено ${txt(x.updated)}, отменено ${txt(x.cancelled)}`),
    stale(x),kindRows(x,"Всё сходится")],null,ML.kamenka));
  const mail=blk("Личная почта");
  mail.append(list(arr(m.personal_mail).map(i=>row(`${txt(i&&i.box)}: `+(i&&typeof i.unread==="number"?`непрочитанных ${i.unread}`:txt(i&&i.unread)))),"Ящик не подключён"));
  const mailGo=chips(ML.personal_mail);if(mailGo)mail.append(mailGo);
  p.append(mail);
  if(arr(m.todo).length){const t=blk("Дела по деньгам");t.append(list(m.todo.map(i=>row(txt(i&&i.text))),""));p.append(t);}
}

function week(w){
  const out=[];
  if(w.verdict)out.push(el("p","lead",txt(w.verdict)));
  if(arr(w.top).length){
    out.push(el("p","muted","Топ недели"));
    out.push(list(w.top.map(t=>row(`${txt(t.author)} — ${typeof t.views==="number"?new Intl.NumberFormat("ru-RU").format(t.views):"—"} просмотров · ${txt(t.ratio)}x. ${txt(t.topic)} `,link("ролик",t.url))),"",true));
  }
  for(const b of arr(w.breakdowns)){
    const d=el("details");d.append(el("summary",null,`Разбор: ${txt(b.title)} (${txt(b.author)})`));
    const body=el("div","pane");
    body.append(el("p",null,`Хук: ${txt(b.hook)}`),el("p",null,`Формат: ${txt(b.format)}`));
    if(arr(b.why).length)body.append(el("p","muted","Почему сработало"),list(b.why.map(x=>row(txt(x))),""));
    body.append(el("p",null,`Идея для нас: ${txt(b.idea)}`));const a=link("Открыть ролик",b.url);if(a)body.append(a);
    d.append(body);out.push(d);
  }
  if(arr(w.takeaways).length){out.push(el("p","muted","Выводы недели"));out.push(list(w.takeaways.map(x=>row(txt(x))),""));}
  if(w.note)out.push(el("p","muted",txt(w.note)));
  return out;
}
function paneRadar(){
  const p=$("pane-radar"),weeks=arr(DATA.radar);p.replaceChildren();
  if(!weeks.length){p.append(el("p","muted","Отчётов радара пока нет."));return;}
  weeks.forEach((w,i)=>{
    const s=blk(i?"Неделя":"Последняя неделя",i?null:"key");s.append(el("h3",null,txt(w.range)));
    if(i){const d=el("details");d.append(el("summary",null,"Показать"));const body=el("div","pane");body.append(...week(w));d.append(body);s.append(d);}
    else s.append(...week(w));
    p.append(s);
  });
}

function show(tab){
  if(!TABS.includes(tab)||(tab==="money"&&!DATA.money))tab="today";
  for(const t of TABS){$("pane-"+t).hidden=t!==tab;$("tab-"+t).setAttribute("aria-selected",String(t===tab));}
  window.scrollTo(0,0);
}
function start(data){
  DATA=data;DATA.stale=isSnapshotStale(data);if(data.source_date)DATA.brief_date=data.source_date;byDate={};
  for(const r of arr(data.records))if(r&&r.date)(byDate[r.date]=byDate[r.date]||[]).push(r);
  const now=omskNow();view=new Date(now.getFullYear(),now.getMonth(),1);selected=iso(now);
  $("lock").hidden=true;$("app").hidden=false;$("nav").hidden=false;$("logout").hidden=false;
  $("tab-money").hidden=!data.money;
  $("upd").textContent="Обновлено "+txt(data.updated);
  paneToday();paneBookings();paneMoney();paneRadar();
  const fromHash=location.hash.replace("#","");
  show(TABS.includes(fromHash)?fromHash:"today");
}
async function unlock(pw){
  if(!(window.crypto&&crypto.subtle)){$("err").textContent="Этот браузер не умеет расшифровывать страницу. Откройте ссылку в Safari или Chrome.";return;}
  $("err").textContent="Проверяю…";
  // The owners' blob holds everything, so it is tried first; each person types only their own password.
  for(const blob of [BLOBS.owner,BLOBS.team]){
    if(!blob)continue;
    try{const data=await decrypt(blob,pw);$("pw").value="";$("err").textContent="";start(data);return;}catch(e){}
  }
  $("err").textContent="Неверный пароль.";
}
$("form").onsubmit=e=>{e.preventDefault();const pw=$("pw").value;if(pw)unlock(pw);};
$("prev").onclick=()=>{view.setMonth(view.getMonth()-1);drawMonth();};
$("next").onclick=()=>{view.setMonth(view.getMonth()+1);drawMonth();};
$("logout").onclick=()=>{DATA=null;$("pw").value="";location.reload();};
for(const t of TABS)$("tab-"+t).onclick=()=>show(t);
$("upd").textContent="Обновлено "+UPDATED;
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshSnapshotDate();});
setInterval(refreshSnapshotDate,60000);
